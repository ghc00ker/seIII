server:
  port: 8080

spring:
  config:
    import: optional:file:.env/deepseek.properties
  mvc:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

app:
  storage:
    root: data
  llm-judge:
    enabled: true
    provider: deepseek
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY:}
